services:
  kafka:
    image: apache/kafka:4.0.0
    container_name: finstream-kafka

    ports:
      - "9092:9092"
      - "29092:29092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT,
        INTERNAL:PLAINTEXT

      KAFKA_LISTENERS: >
        PLAINTEXT://:9092,
        INTERNAL://:29092,
        CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: >
        PLAINTEXT://localhost:9092,
        INTERNAL://kafka:29092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  kafka-init:
    image: apache/kafka:4.0.0
    container_name: finstream-kafka-init

    depends_on:
      kafka:
        condition: service_healthy

    command:
      - /bin/bash
      - -c
      - |
        echo "Creating Kafka topics..."

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --create \
          --if-not-exists \
          --topic transactions \
          --partitions 3 \
          --replication-factor 1

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --create \
          --if-not-exists \
          --topic transactions.dlq \
          --partitions 1 \
          --replication-factor 1

        echo "Kafka topics ready."


  postgres:
    image: postgres:17
    container_name: finstream-postgres

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: finstream
      POSTGRES_PASSWORD: finstream_dev
      POSTGRES_DB: finstream

    volumes:
      - finstream_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U finstream -d finstream"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  db-init:
    image: postgres:17
    container_name: finstream-db-init

    environment:
      PGPASSWORD: finstream_dev

    volumes:
      - ./database/init.sql:/scripts/init.sql:ro

    depends_on:
      postgres:
        condition: service_healthy

    command:
      [
        "psql",
        "-h",
        "postgres",
        "-U",
        "finstream",
        "-d",
        "finstream",
        "-f",
        "/scripts/init.sql"
      ]


  producer:
    image: finstream-producer:dev
    container_name: finstream-producer

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: transactions

    depends_on:
      kafka-init:
        condition: service_completed_successfully

    restart: unless-stopped


  processor:
    image: finstream-processor:dev
    container_name: finstream-processor

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: transactions
      KAFKA_DLQ_TOPIC: transactions.dlq

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: finstream
      POSTGRES_USER: finstream
      POSTGRES_PASSWORD: finstream_dev

    depends_on:
      kafka-init:
        condition: service_completed_successfully

      db-init:
        condition: service_completed_successfully

    restart: unless-stopped


  api:
    image: finstream-api:dev
    container_name: finstream-api

    ports:
      - "8000:8000"

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: finstream
      POSTGRES_USER: finstream
      POSTGRES_PASSWORD: finstream_dev

    depends_on:
      db-init:
        condition: service_completed_successfully

    restart: unless-stopped


volumes:
  finstream_postgres_data:
