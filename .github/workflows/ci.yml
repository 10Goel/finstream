name: FinStream CI

run-name: "${{ github.event.head_commit.message || github.event.pull_request.title || 'FinStream CI' }}"

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: ruff check .

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

      - name: Run tests
        run: python -m pytest


  compose-validation:
    name: Validate Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config


  docker-build:
    name: Build Docker Image - ${{ matrix.service }}
    runs-on: ubuntu-latest

    needs:
      - test
      - compose-validation

    strategy:
      matrix:
        service:
          - api
          - producer
          - processor

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ${{ matrix.service }} image
        run: |
          docker build \
            -f docker/${{ matrix.service }}/Dockerfile \
            -t finstream-${{ matrix.service }}:ci \
            .

  smoke-test:
    name: Full Stack Smoke Test
    runs-on: ubuntu-latest

    needs:
      - test
      - compose-validation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build API image
        run: |
          docker build \
            -f docker/api/Dockerfile \
            -t finstream-api:dev \
            .

      - name: Build producer image
        run: |
          docker build \
            -f docker/producer/Dockerfile \
            -t finstream-producer:dev \
            .

      - name: Build processor image
        run: |
          docker build \
            -f docker/processor/Dockerfile \
            -t finstream-processor:dev \
            .

      - name: Start FinStream platform
        run: docker compose up -d

      - name: Wait for services
        run: |
          for i in {1..30}; do
            if curl --fail http://localhost:8000/health; then
              exit 0
            fi

            echo "Waiting for FinStream API..."
            sleep 5
          done

          echo "FinStream API failed to become ready."
          docker compose ps -a
          docker compose logs
          exit 1

      - name: Verify PostgreSQL-backed API
        run: |
          curl --fail \
            "http://localhost:8000/transactions?limit=1"

      - name: Show container status
        if: always()
        run: docker compose ps -a

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop FinStream platform
        if: always()
        run: docker compose down -v
