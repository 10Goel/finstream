apiVersion: apps/v1
kind: Deployment

metadata:
  name: api
  namespace: finstream

spec:
  replicas: 1

  selector:
    matchLabels:
      app: api

  template:
    metadata:
      labels:
        app: api

    spec:
      containers:
        - name: api
          image: finstream-api:dev
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          env:
            - name: PYTHONUNBUFFERED
              value: "1"

          envFrom:
            - configMapRef:
                name: finstream-config

            - secretRef:
                name: finstream-secret

---
apiVersion: v1
kind: Service

metadata:
  name: api
  namespace: finstream

spec:
  selector:
    app: api

  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000

  type: ClusterIP
