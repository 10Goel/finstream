apiVersion: v1
kind: ConfigMap

metadata:
  name: grafana-dashboard-provider
  namespace: finstream

data:
  dashboards.yaml: |
    apiVersion: 1

    providers:
      - name: FinStream
        orgId: 1
        folder: FinStream
        type: file
        disableDeletion: true
        editable: false
        updateIntervalSeconds: 10

        options:
          path: /var/lib/grafana/dashboards
